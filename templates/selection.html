<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Quiz Center — Exam Selection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/style_sheets/selection.css">
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-mark">QC</div>
      <span class="logo-text">Davidson Quiz Center</span>
    </div>
    <!-- Show who is logged in (Jinja2 injects name from session) -->
    {% if student_name %}
    <div class="student-badge">Signed in as {{ student_name }}</div>
    {% endif %}

    <h1>Select Your Exam</h1>
    <p class="subtitle">Choose your professor, course, and exam. A QR code will be generated for check-in.</p>

    <form method="POST" action="/qr_generate">

      <!--
        Hidden fields carry student identity from Flask session
        into the qr_generate POST so the submission record gets
        the student's name and email.
      -->
      <input type="hidden" name="studentName"  value="{{ student_name }}"/>
      <input type="hidden" name="studentEmail" value="{{ student_email }}"/>

      <div class="field">
        <label>Professor</label>
        <select id="professor" name="facultyName" onchange="updateCourses()" required>
          <option value="">Select professor…</option>
          <option value="Dr. Ramanujan">Dr. Ramanujan</option>
          <option value="Dr. Lim">Dr. Lim</option>
          <option value="Dr. Duhon">Dr. Duhon</option>
        </select>
      </div>
      <div class="field">
        <label>Course</label>
        <select id="course" name="course" required disabled>
          <option value="">Select professor first</option>
        </select>
      </div>
      <div class="field">
        <label>Accommodations</label>
        <div class="accom-grid">
          <div class="accom-option">
            <input type="radio" id="acc-none" name="accommodation" value="None" checked/>
            <label for="acc-none">None</label>
          </div>
          <div class="accom-option">
            <input type="radio" id="acc-rd" name="accommodation" value="Reduced Distraction"/>
            <label for="acc-rd">Reduced Distraction</label>
          </div>
          <div class="accom-option">
            <input type="radio" id="acc-et" name="accommodation" value="extended time"/>
            <label for="acc-et">Extended Time</label>
          </div>
          <div class="accom-option">
            <input type="radio" id="acc-aadr" name="accommodation" value="AADR extended"/>
            <label for="acc-aadr">AADR</label>
          </div>
        </div>
      </div>
      <button class="btn-primary" type="submit">Generate QR Code →</button>
    </form>
  </div>
  <script src="/static/scripts/selection.js"></script>
</body>
</html>
