<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/static/style_sheets/student.css">
    <title>Check-In Successful</title>
    <style>
        .success-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }
        
        .checkmark {
            font-size: 5rem;
            color: var(--success);
            margin-bottom: 1rem;
            animation: scaleIn 0.5s ease;
        }
        
        @keyframes scaleIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .success-message {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--text) 40%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .success-details {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        
        .back-link {
            display: inline-block;
            padding: 12px 30px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-weight: 500;
            box-shadow: 0 2px 12px rgba(79, 142, 247, 0.3);
            transition: all 0.2s ease;
        }
        
        .back-link:hover {
            background: #6aa0ff;
            transform: translateY(-1px);
            box-shadow: 0 4px 18px rgba(79, 142, 247, 0.4);
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="checkmark">✓</div>
        <h1 class="success-message">Check-In Successful!</h1>
        <p class="success-details">
            You've been checked in to the Quiz Center.<br>
            Please proceed to your assigned testing room.<br>
            Good luck on your exam!
        </p>
        <a href="/student" class="back-link">Return to Login</a>
    </div>
</body>
</html>
