<!DOCTYPE html>
<html lang = 'en'>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="google-signin-client_id" content="318874378262-do4uihbnlojtv39fm05ctcncfjkgvb4v.apps.googleusercontent.com">
        <link rel="stylesheet" href="/static/student.css">
        <title>Student Login</title> 
    </head>
    <body>

        <div class="triangle-container">
            <h1 id="Title">Quiz Center Login In</h1>
            <p id="Instructions"> Please enter either your @davidson email or 
                Student ID and password</p>
            <form class="triangle-form" id="loginForm">
                <div class="top-row">
                    <div class="field">
                        <label for="email">Enter your email:</label>
                        <input type="email" id="email" name="email" placeholder="@davidson.edu">
                    </div>
                    <div class="field">
                        <label for="studentID">Student ID:</label>
                        <input type="text" id="studentID" name="studentID" placeholder="Student ID">
                    </div>
                </div>
                <div class="bottom-row">
                    <div class="field">
                        <label for="pwd">Password:</label>
                        <input type="password" id="pwd" name="pwd" placeholder="Password" required>
                    </div>
                </div>
                <input id="submit-btn" type="submit" value="Submit">
                
            </form>
            <div class="g-signin2" data-onsuccess="onSignIn"></div>
        </div>
              
        <script src="/static/student.js"></script>
        <script src="https://apis.google.com/js/platform.js" async defer></script>
        <script >
            function onSignIn(googleUser) {
  var profile = googleUser.getBasicProfile();
  console.log('ID: ' + profile.getId()); // Do not send to your backend! Use an ID token instead.
  console.log('Name: ' + profile.getName());
  console.log('Image URL: ' + profile.getImageUrl());
  console.log('Email: ' + profile.getEmail()); // This is null if the 'email' scope is not present.
}
        </script>
        <a href="#" onclick="signOut();">Sign out</a>
<script>
  function signOut() {
    var auth2 = gapi.auth2.getAuthInstance();
    auth2.signOut().then(function () {
      console.log('User signed out.');
    });
  }
</script>

    </body>
</html>
