<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scan QR</title>
    <style>
      body { font-family: system-ui; max-width: 900px; margin: 24px auto; padding: 0 16px; }
      #reader { width: 360px; }
      pre { background: #f6f6f6; padding: 12px; border: 1px solid #ddd; overflow: auto; }
      .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
      .muted { color: #666; }
      nav a { margin-right: 12px; }
      input, button { padding: 10px; font-size: 14px; }
    </style>
  </head>
  <body>
    <h1>Scan QR</h1>
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/qr">QR Generator</a>
    </nav>

    <p class="muted">
      The QR should contain a submission id like <b>QS-0002</b>. On scan, we call:
      <code>/api/submissions/&lt;id&gt;</code>
    </p>

    <div class="row">
      <div>
        <h3>Camera Scanner</h3>
        <div id="reader"></div>
        <p class="muted">Camera permissions will fail ofc so use Manual Lookup</p>
      </div>

      <div style="flex: 1; min-width: 320px;">
        <h3>Manual Lookup</h3>
        <div class="row" style="gap: 8px;">
          <input id="manualId" value="QS-0002" placeholder="QS-0002" />
          <button id="lookupBtn">Lookup</button>
        </div>

        <h3 style="margin-top: 16px;">Result</h3>
        <pre id="output">Waiting for scan or lookup...</pre>
      </div>
    </div>

    <!-- QR scanner library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="/static/scan.js"></script>
  </body>
</html>
