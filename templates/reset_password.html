<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Quiz Center — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/style_sheets/student.css"/>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-mark">QC</div>
      <span class="logo-text">Davidson Quiz Center</span>
    </div>
    <h1>Choose New Password</h1>
    <p class="subtitle">Enter a new password for <strong style="color:var(--text)">{{ email }}</strong></p>

    <form id="resetForm" novalidate>
      <input type="hidden" id="r-email" value="{{ email }}"/>
      <input type="hidden" id="r-token" value="{{ token }}"/>

      <div class="field">
        <label for="r-pwd">New Password</label>
        <input type="password" id="r-pwd" placeholder="At least 6 characters"/>
      </div>
      <div class="field">
        <label for="r-pwd2">Confirm New Password</label>
        <input type="password" id="r-pwd2" placeholder="••••••••"/>
      </div>

      <button class="btn-primary" type="submit">Update Password</button>
      <div class="error-msg" id="reset-error"></div>
      <div class="success-msg" id="reset-success"></div>
    </form>
  </div>

  <script>
    document.getElementById('resetForm').onsubmit = async (e) => {
      e.preventDefault();
      const email    = document.getElementById('r-email').value;
      const token    = document.getElementById('r-token').value;
      const password = document.getElementById('r-pwd').value;
      const password2= document.getElementById('r-pwd2').value;
      const errEl    = document.getElementById('reset-error');
      const okEl     = document.getElementById('reset-success');

      errEl.style.display = 'none';
      okEl.style.display  = 'none';

      if (password.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; errEl.style.display = 'block'; return; }
      if (password !== password2) { errEl.textContent = 'Passwords do not match.'; errEl.style.display = 'block'; return; }

      const res  = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, token, password }),
      });
      const data = await res.json();

      if (!res.ok) { errEl.textContent = data.error || 'Something went wrong.'; errEl.style.display = 'block'; return; }

      okEl.textContent = 'Password updated! Redirecting to sign in…';
      okEl.style.display = 'block';
      setTimeout(() => window.location.href = '/student', 2000);
    };
  </script>
</body>
</html>
