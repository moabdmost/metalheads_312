<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/static/style_sheets/dashboard.css">
    <title>Professor Analytics</title>
</head>
<body>
    <div class="page-wrapper">
        <div class="analytics-header">
            <h1>Professor Analytics Dashboard</h1>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label for="courseFilter">Course</label>
                <select id="courseFilter">
                    <option value="">All Courses</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="statusFilter">Status</label>
                <select id="statusFilter">
                    <option value="">All Statuses</option>
                    <option value="PENDING">Pending</option>
                    <option value="VERIFIED">Verified</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="COMPLETED">Completed</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="startDate">Start Date</label>
                <input type="date" id="startDate">
            </div>
            
            <div class="filter-group">
                <label for="endDate">End Date</label>
                <input type="date" id="endDate">
            </div>
            
            <div class="filter-group" style="justify-content: flex-end;">
                <label>&nbsp;</label>
                <button id="applyFilters" style="padding: 8px 20px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); cursor: pointer;">
                    Apply Filters
                </button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Submissions</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Completed</div>
                <div class="stat-value" id="completedCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">In Progress</div>
                <div class="stat-value" id="inProgressCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pending</div>
                <div class="stat-value" id="pendingCount">0</div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Student</th>
                    <th>Course / Exam</th>
                    <th>Check-In Time</th>
                    <th>Check-Out Time</th>
                    <th>Status</th>
                    <th>Faculty</th>
                </tr>
            </thead>
            <tbody id="analyticsRows"></tbody>
        </table>

        <div class="export-buttons">
            <button class="export-btn pdf" id="exportPDF">
                📄 Export as PDF
            </button>
            <button class="export-btn csv" id="exportCSV">
                📊 Export as CSV
            </button>
        </div>
    </div>

    <script src="/static/scripts/professor_analytics.js"></script>
</body>
</html>
