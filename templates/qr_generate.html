<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR Generator</title>
    <style>
      body { font-family: system-ui; max-width: 900px; margin: 24px auto; padding: 0 16px; }
      .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      input, select, button { padding: 10px; font-size: 14px; }
      #qrcode { margin-top: 16px; padding: 16px; border: 1px solid #ddd; display: inline-block; }
      .hint { color: #666; margin-top: 8px; }
      nav a { margin-right: 12px; }
    </style>
  </head>
  <body>
    <h1>QR Generator</h1>
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/scan">Scan</a>
    </nav>

    <p>Generate a QR code that encodes a submission <b>id</b> like <b>QS-0002</b>.</p>

    <div class="row">
      <label for="preset">Quick pick:</label>
      <select id="preset">
        <option value="QS-0001">QS-0001</option>
        <option value="QS-0002" selected>QS-0002</option>
        <option value="QS-0003">QS-0003</option>
        <option value="QS-0004">QS-0004</option>
        <option value="QS-0005">QS-0005</option>
        <option value="QS-0006">QS-0006</option>
      </select>

      <label for="sid">Or type ID:</label>
      <input id="sid" type="text" value="QS-0002" placeholder="QS-0002" />

      <button id="make">Generate</button>
    </div>

    <div id="qrcode"></div>

    <!-- QR Code library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="/static/qr_generate.js"></script>
  </body>
</html>
